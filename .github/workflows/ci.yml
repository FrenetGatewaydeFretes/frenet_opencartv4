name: CI

on:
  push:
    branches:
      - main
      - 3.0-develop
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PUBLISHED_COMMIT: 3ae7a7befc82ef1a16285703699f249f612de99a

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: find admin catalog system -name '*.php' -print0 | xargs -0 -n1 php -l

  quality:
    name: Style, compatibility and PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer cs
      - run: composer compat
      - run: composer phpstan

  test:
    name: Unit tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  package:
    name: Build opencartfrenetv4.ocmod.zip and the published 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=opencartfrenetv4.ocmod.zip HEAD install.json admin catalog system
      - name: Build the package of the published version 1.0.0
        run: |
          git fetch --no-tags --depth=1 origin "$PUBLISHED_COMMIT"
          git archive --format=zip --output=previous.ocmod.zip FETCH_HEAD install.json admin catalog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencartfrenetv4.ocmod.zip
          path: opencartfrenetv4.ocmod.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous.ocmod.zip
          path: previous.ocmod.zip
          if-no-files-found: error

  e2e:
    name: E2E ${{ matrix.mode }} OpenCart ${{ matrix.opencart }} (PHP ${{ matrix.php }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { opencart: 4.0.0.0, php: '8.0', mode: install }
          - { opencart: 4.0.0.0, php: '8.1', mode: install }
          - { opencart: 4.0.0.0, php: '8.1', mode: upgrade }
          - { opencart: 4.0.1.1, php: '8.0', mode: install }
          - { opencart: 4.0.1.1, php: '8.1', mode: install }
          - { opencart: 4.0.1.1, php: '8.1', mode: upgrade }
          - { opencart: 4.0.2.0, php: '8.0', mode: install }
          - { opencart: 4.0.2.0, php: '8.3', mode: install }
          - { opencart: 4.0.2.0, php: '8.3', mode: upgrade }
          - { opencart: 4.0.2.3, php: '8.0', mode: install }
          - { opencart: 4.0.2.3, php: '8.3', mode: install }
          - { opencart: 4.0.2.3, php: '8.3', mode: upgrade }
          - { opencart: 4.1.0.0, php: '8.0', mode: install }
          - { opencart: 4.1.0.0, php: '8.5', mode: install }
          - { opencart: 4.1.0.0, php: '8.5', mode: upgrade }
          - { opencart: 4.1.0.3, php: '8.0', mode: install }
          - { opencart: 4.1.0.3, php: '8.5', mode: install }
          - { opencart: 4.1.0.3, php: '8.5', mode: upgrade }
          - { opencart: 4.1.0.4, php: '8.1', mode: install }
          - { opencart: 4.1.0.4, php: '8.5', mode: install }
          - { opencart: 4.1.0.4, php: '8.5', mode: upgrade }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencartfrenetv4.ocmod.zip
      - if: matrix.mode == 'upgrade'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous.ocmod.zip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: tests/e2e/run.sh ${{ matrix.opencart }} ${{ matrix.php }} opencartfrenetv4.ocmod.zip ${{ matrix.mode == 'upgrade' && 'previous.ocmod.zip' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.mode }}-${{ matrix.opencart }}-php${{ matrix.php }}
          path: tests/e2e/.work/artifacts/
          if-no-files-found: ignore
