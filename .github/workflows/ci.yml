name: CI

on:
  push:
    branches:
      - main
      - 3.0-develop
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: find admin catalog system -name '*.php' -print0 | xargs -0 -n1 php -l

  quality:
    name: Style, compatibility and PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer cs
      - run: composer compat
      - run: composer phpstan

  test:
    name: Unit tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  package:
    name: Build opencartfrenetv4.ocmod.zip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=opencartfrenetv4.ocmod.zip HEAD install.json admin catalog system
      - uses: actions/upload-artifact@v7
        with:
          name: opencartfrenetv4.ocmod.zip
          path: opencartfrenetv4.ocmod.zip
          if-no-files-found: error

  e2e:
    name: E2E OpenCart ${{ matrix.opencart }} (PHP ${{ matrix.php }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { opencart: 4.0.0.0, php: '8.0' }
          - { opencart: 4.0.0.0, php: '8.1' }
          - { opencart: 4.0.1.1, php: '8.0' }
          - { opencart: 4.0.1.1, php: '8.1' }
          - { opencart: 4.0.2.0, php: '8.0' }
          - { opencart: 4.0.2.0, php: '8.3' }
          - { opencart: 4.0.2.3, php: '8.0' }
          - { opencart: 4.0.2.3, php: '8.3' }
          - { opencart: 4.1.0.0, php: '8.0' }
          - { opencart: 4.1.0.0, php: '8.5' }
          - { opencart: 4.1.0.3, php: '8.0' }
          - { opencart: 4.1.0.3, php: '8.5' }
          - { opencart: 4.1.0.4, php: '8.1' }
          - { opencart: 4.1.0.4, php: '8.5' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: opencartfrenetv4.ocmod.zip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: tests/e2e/run.sh ${{ matrix.opencart }} ${{ matrix.php }} opencartfrenetv4.ocmod.zip
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.opencart }}-php${{ matrix.php }}
          path: tests/e2e/.work/artifacts/
          if-no-files-found: ignore
